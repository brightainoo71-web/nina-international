services:
  - type: web
    name: nina-backend-api
    env: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5050
      - key: PEPPER_KEY_ID
        value: nina-pepper-v1
      - key: ARGON2_MEMORY_COST
        value: 65536
      - key: ARGON2_TIME_COST
        value: 3
      - key: ARGON2_PARALLELISM
        value: 4
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: AWS_REGION
        value: eu-north-1
      - key: AWS_S3_BACKUP_BUCKET
        value: nina--securebackups
